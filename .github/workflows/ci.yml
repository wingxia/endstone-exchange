name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: endstone_exchange_test
          MYSQL_ROOT_PASSWORD: exchange_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=exchange_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      EXCHANGE_TEST_DB_HOST: 127.0.0.1
      EXCHANGE_TEST_DB_PORT: 3306
      EXCHANGE_TEST_DB_USER: root
      EXCHANGE_TEST_DB_PASSWORD: exchange_test

    steps:
      - uses: actions/checkout@v7

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libc++-dev libc++abi-dev libmariadb-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DEXCHANGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
