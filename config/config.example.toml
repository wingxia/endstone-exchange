# Copy this file to plugins/exchange/config.toml.
# Never commit a real database password.

[database]
host = "127.0.0.1"
port = 3306
user = "exchange"
password = ""
name = "endstone_exchange"
connect_timeout_seconds = 5

[market]
initial_balance = 10000.00
max_order_quantity = 640
price_min = 1
price_max = 5000
price_step = 1
order_book_depth = 5
hologram_refresh_ticks = 20
frame_capture_delay_ticks = 80
cleanup_structure_captures = true

[economy]
# "internal" keeps the built-in exchange balance. "umoney" directly calls
# the loaded UMoney plugin and automatically settles purchases and proceeds.
provider = "internal"
umoney_plugin = "umoney"
recovery_interval_ticks = 100
