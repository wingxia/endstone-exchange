[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-exchange-umoney-bridge"
version = "1.0.0"
description = "Crash-recoverable local UMoney gateway for Endstone Exchange"
requires-python = ">=3.11"

[project.entry-points."endstone"]
exchange_umoney_bridge = "endstone_exchange_umoney_bridge:UMoneyBridgePlugin"

[tool.hatch.build.targets.wheel]
packages = ["endstone_exchange_umoney_bridge"]
